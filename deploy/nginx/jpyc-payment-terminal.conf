upstream jpyc_terminal_app {
  server app:4173;
  keepalive 32;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  return 444;
}

server {
  listen 80;
  listen [::]:80;
  server_name pay.miyamibu.xyz;
  return 301 https://pay.miyamibu.xyz$request_uri;
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  server_name _;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  return 444;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name pay.miyamibu.xyz;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 2m;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # Overwrite, do not append, so an untrusted client cannot spoof the audit
  # and rate-limit source address through X-Forwarded-For.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port 443;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_read_timeout 30s;
  proxy_send_timeout 30s;

  add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    proxy_pass http://jpyc_terminal_app;
  }
}
