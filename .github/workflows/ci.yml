name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "release-*"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: "development"
      APP_PORT: "4173"
      APP_HOST: "http://127.0.0.1:4173"
      APP_SECRET: "ci-app-secret-1234567890abcdefghijklmnopqrstuvwxyz"
      SERVICE_INGEST_SECRET: "ci-ingest-secret-1234567890abcdefghijklmnopqrstuvwxyz"
      METRICS_SECRET: "ci-metrics-secret-1234567890abcdefghijklmnopqrstuvwxyz"
      DB_PATH: "./data/ci.db"
      WORKER_STATE_DB_PATH: "./runtime/worker-state/chain-137.db"
      # Syntax-only digest fixtures for production compose validation. They are
      # never published or accepted as production release identities.
      APP_IMAGE_REF: "registry.invalid/jpyc-terminal@sha256:1111111111111111111111111111111111111111111111111111111111111111"
      NGINX_IMAGE_REF: "registry.invalid/nginx@sha256:2222222222222222222222222222222222222222222222222222222222222222"
      TERMINAL_CODE: "TERM-001"
      STAFF_PIN: "1234"
      SECOND_ADMIN_PIN: "5678"
      ENABLED_PAYMENT_CHAIN_IDS: "137"
      TOKEN_CONTRACT: "0xE7C3D8C9a439feDe00D2600032D5dB0Be71C3c29"
      APPROVED_JPYC_TOKEN_CONTRACT: "0xE7C3D8C9a439feDe00D2600032D5dB0Be71C3c29"
      JPYC_CONTRACT_APPROVAL_REF: "CI-JPYC-CONTRACT-001"
      RECIPIENT_ADDRESS: "0x2222222222222222222222222222222222222222"
      TOKEN_DECIMALS: "18"
      JPYC_BASE_UNIT_SCALE: "1000000"
      REQUIRED_CONFIRMATIONS: "2"
      MIN_REQUIRED_CONFIRMATIONS: "2"
      MONITOR_BACKSCAN_BLOCKS: "12"
      MIN_MONITOR_BACKSCAN_BLOCKS: "12"
      ENABLE_PUBLIC_PAYMENT_SIMULATION: "false"
      DEMO_CONTROLS_ENABLED: "false"
      DIAGNOSTIC_MODE_ENABLED: "false"
      CORS_ALLOW_ORIGINS: "http://localhost:4173,http://127.0.0.1:4173"
      SERVICE_AUTH_MAX_SKEW_SEC: "300"
      SERVICE_AUTH_MAX_FUTURE_SEC: "30"
      SERVICE_REPLAY_GUARD_TTL_SEC: "86400"
      SESSION_TTL_SEC: "43200"
      IDEMPOTENCY_TTL_SEC: "86400"
      PIN_LOCKOUT_MAX_ATTEMPTS: "5"
      PIN_LOCKOUT_SEC: "900"
      SSE_TOKEN_MAX_TTL_SEC: "900"
      WORKER_STALE_SEC: "999999"
      REFUND_EXECUTION_REQUIRES_DISTINCT_ACTOR: "true"
      WALLET_ADAPTER_TYPE: "mock"
      ENABLE_REOWN: "false"
      CHECKOUT_SESSION_IMPLEMENTED: "true"
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Prepare safe compose env
        run: cp .env.production.example .env.production

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Audit
        run: npm run audit

      - name: Commercial gate fails closed without production evidence
        run: |
          set +e
          npm run commercial:gate
          status=$?
          test "$status" -eq 10

      - name: Limited gate fails closed without production evidence
        run: |
          set +e
          npm run limited:gate
          status=$?
          test "$status" -eq 10

      - name: Deploy check
        run: npm run deploy:check

      - name: Smoke
        run: |
          set -euo pipefail
          mkdir -p /tmp/jpyc-ci
          SMOKE_ROOT="$(mktemp -d "${RUNNER_TEMP:-/tmp}/jpyc-smoke.XXXXXX")"
          mkdir -p "${SMOKE_ROOT}/backups"
          export SMOKE_RUNTIME_DIR="${SMOKE_ROOT}"
          export DB_PATH="${SMOKE_ROOT}/app.db"
          export WORKER_STATE_DB_PATH="${SMOKE_ROOT}/worker-state.db"
          export BACKUP_DIR="${SMOKE_ROOT}/backups"
          export RECEIVE_ADDRESS_DEV_AUTO_VERIFY="true"
          {
            echo "SMOKE_RUNTIME_DIR=${SMOKE_RUNTIME_DIR}"
            echo "DB_PATH=${DB_PATH}"
            echo "WORKER_STATE_DB_PATH=${WORKER_STATE_DB_PATH}"
            echo "BACKUP_DIR=${BACKUP_DIR}"
          } >> "${GITHUB_ENV}"
          # SQLite creates the per-smoke -wal and -shm files beside this DB.
          MAX_ACTIVE_INVOICES_PER_RECIPIENT=50 node src/server.mjs > /tmp/jpyc-ci/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS "http://127.0.0.1:4173/healthz" >/dev/null; then
              break
            fi
            sleep 1
          done
          MAX_ACTIVE_INVOICES_PER_RECIPIENT=50 SMOKE_REUSE_EXISTING=true npm run test:smoke

      - name: Audit chain
        run: npm run test:audit-chain

      - name: Smoke failure logs
        if: failure()
        run: |
          if [ -f /tmp/jpyc-ci/server.log ]; then
            echo "==== /tmp/jpyc-ci/server.log ===="
            cat /tmp/jpyc-ci/server.log
          fi

      - name: Docker version
        run: docker version

      - name: Docker build
        run: |
          mkdir -p /tmp/jpyc-ci
          IMAGE_TAG="jpyc-terminal-production:ci-${GITHUB_SHA}"
          docker build --build-arg "SOURCE_COMMIT=${GITHUB_SHA}" . --tag "${IMAGE_TAG}"

      - name: Verify image source label
        run: |
          IMAGE_TAG="jpyc-terminal-production:ci-${GITHUB_SHA}"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "${IMAGE_TAG}")" = "${GITHUB_SHA}"

      - name: Docker compose config
        run: docker compose --env-file .env.production -f docker-compose.prod.yml config

      # This CI-only release-input metadata is generated only after every
      # required validation and image/compose check above has succeeded.
      - name: Generate CI build metadata after required checks
        if: success()
        run: |
          IMAGE_TAG="jpyc-terminal-production:ci-${GITHUB_SHA}"
          IMAGE_ID="$(docker image inspect --format '{{.Id}}' "${IMAGE_TAG}")"
          jq -n \
            --arg source_sha "${GITHUB_SHA}" \
            --arg local_image_id "${IMAGE_ID}" \
            '{source_sha: $source_sha, local_image_id: $local_image_id, registry_digest: null, production_release_eligible: false}' \
            > /tmp/jpyc-ci/build-metadata.json

      - name: Upload CI build metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-build-metadata-${{ github.sha }}
          path: /tmp/jpyc-ci/build-metadata.json
          if-no-files-found: error

  # M-015: rendered browser/UI validation for the exact pushed SHA. Playwright
  # is installed at a pinned npm version with --no-save so repository
  # dependencies stay untouched, and evidence lands in a deterministic
  # run-id/attempt/job directory that is verified fail-closed before upload.
  ui-evidence:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_PINNED_VERSION: "1.62.1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Install pinned Playwright without changing repo dependencies
        run: |
          npm install --package-lock=false --no-save --no-audit --no-fund "playwright@${PLAYWRIGHT_PINNED_VERSION}"
          node node_modules/playwright/cli.js install --with-deps chromium
          installed="$(node -p "require('./node_modules/playwright/package.json').version")"
          test "${installed}" = "${PLAYWRIGHT_PINNED_VERSION}"
          git diff --exit-code -- package.json package-lock.json

      - name: Resolve pinned browser executable from the installed registry
        id: browser
        run: |
          BROWSER="$(node -p "require('playwright').chromium.executablePath()")"
          test -n "$BROWSER" && test -x "$BROWSER"
          echo "executable=${BROWSER}" >> "$GITHUB_OUTPUT"

      - name: Run rendered UI evidence suite
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: |
          node scripts/story-ui-retest.mjs \
            --browser-executable "${{ steps.browser.outputs.executable }}"

      # The suite writes to a deterministic directory derived from the CI run
      # identity (see scripts/ui-evidence-contract.mjs). There is intentionally
      # no find/latest scan: only the known path may be uploaded.
      - name: Verify UI evidence with dedicated CLI
        id: ui_evidence
        run: |
          test "${GITHUB_JOB}" = "ui-evidence"
          EVIDENCE_DIR="output/playwright/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          node scripts/verify-ui-evidence.mjs --evidence-dir "${EVIDENCE_DIR}"
          echo "path=${EVIDENCE_DIR}" >> "$GITHUB_OUTPUT"

      - name: Upload UI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-evidence-${{ github.sha }}
          path: ${{ steps.ui_evidence.outputs.path }}
          if-no-files-found: error

  production-validation-evidence:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: "development"
      APP_PORT: "4173"
      APP_HOST: "http://127.0.0.1:4173"
      APP_SECRET: "ci-app-secret-1234567890abcdefghijklmnopqrstuvwxyz"
      SERVICE_INGEST_SECRET: "ci-ingest-secret-1234567890abcdefghijklmnopqrstuvwxyz"
      METRICS_SECRET: "ci-metrics-secret-1234567890abcdefghijklmnopqrstuvwxyz"
      DB_PATH: "./docs/production/evidence/ci-validation.db"
      WORKER_STATE_DB_PATH: "./docs/production/evidence/ci-worker-state.db"
      BACKUP_DIR: "./docs/production/evidence/ci-backups"
      APP_IMAGE_REF: "registry.invalid/jpyc-terminal@sha256:1111111111111111111111111111111111111111111111111111111111111111"
      NGINX_IMAGE_REF: "registry.invalid/nginx@sha256:2222222222222222222222222222222222222222222222222222222222222222"
      TERMINAL_CODE: "TERM-001"
      STAFF_PIN: "1234"
      SECOND_ADMIN_PIN: "5678"
      ENABLED_PAYMENT_CHAIN_IDS: "137"
      TOKEN_CONTRACT: "0xE7C3D8C9a439feDe00D2600032D5dB0Be71C3c29"
      APPROVED_JPYC_TOKEN_CONTRACT: "0xE7C3D8C9a439feDe00D2600032D5dB0Be71C3c29"
      JPYC_CONTRACT_APPROVAL_REF: "CI-JPYC-CONTRACT-001"
      RECIPIENT_ADDRESS: "0x2222222222222222222222222222222222222222"
      TOKEN_DECIMALS: "18"
      JPYC_BASE_UNIT_SCALE: "1000000"
      REQUIRED_CONFIRMATIONS: "2"
      MIN_REQUIRED_CONFIRMATIONS: "2"
      MONITOR_BACKSCAN_BLOCKS: "12"
      MIN_MONITOR_BACKSCAN_BLOCKS: "12"
      ENABLE_PUBLIC_PAYMENT_SIMULATION: "false"
      DEMO_CONTROLS_ENABLED: "false"
      DIAGNOSTIC_MODE_ENABLED: "false"
      CORS_ALLOW_ORIGINS: "http://localhost:4173,http://127.0.0.1:4173"
      SERVICE_AUTH_MAX_SKEW_SEC: "300"
      SERVICE_AUTH_MAX_FUTURE_SEC: "30"
      SERVICE_REPLAY_GUARD_TTL_SEC: "86400"
      SESSION_TTL_SEC: "43200"
      IDEMPOTENCY_TTL_SEC: "86400"
      PIN_LOCKOUT_MAX_ATTEMPTS: "5"
      PIN_LOCKOUT_SEC: "900"
      SSE_TOKEN_MAX_TTL_SEC: "900"
      WORKER_STALE_SEC: "999999"
      REFUND_EXECUTION_REQUIRES_DISTINCT_ACTOR: "true"
      WALLET_ADAPTER_TYPE: "mock"
      ENABLE_REOWN: "false"
      CHECKOUT_SESSION_IMPLEMENTED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Prepare safe compose env
        run: cp .env.production.example .env.production

      - name: Start isolated validation server
        run: |
          node src/server.mjs > /tmp/jpyc-production-validation-server.log 2>&1 &
          echo "$!" > /tmp/jpyc-production-validation-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "${APP_HOST}/healthz" >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/jpyc-production-validation-server.pid)" 2>/dev/null; then
              cat /tmp/jpyc-production-validation-server.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/jpyc-production-validation-server.log
          exit 1

      - name: Run production validation pack
        run: npm run production:validate

      - name: Stop isolated validation server
        if: always()
        run: |
          if test -f /tmp/jpyc-production-validation-server.pid; then
            SERVER_PID="$(cat /tmp/jpyc-production-validation-server.pid)"
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          fi

      - name: Detect latest evidence dir
        id: evidence
        run: |
          EVIDENCE_DIR="$(find docs/production/evidence -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          echo "path=${EVIDENCE_DIR}" >> "$GITHUB_OUTPUT"
          test -n "${EVIDENCE_DIR}"

      - name: Upload production validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-validation-evidence-${{ github.sha }}
          path: ${{ steps.evidence.outputs.path }}
          if-no-files-found: error
