x-node-hardening: &node-hardening
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  pids_limit: 256
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-worker-healthcheck: &worker-healthcheck
  test:
    - CMD
    - node
    - -e
    - >-
      const Database=require('better-sqlite3');
      const db=new Database(process.env.DB_PATH||'./runtime/data/app.db',{readonly:true,fileMustExist:true});
      const key='worker:'+(process.env.CHAIN_ID||'137')+':last_cycle_at';
      const row=db.prepare('SELECT value FROM chain_monitor_state WHERE key = ?').get(key);
      db.close();
      const cycleAt=Date.parse(row?.value||'');
      const staleMs=Number(process.env.WORKER_STALE_SEC||180)*1000;
      process.exit(Number.isFinite(cycleAt)&&Number.isFinite(staleMs)&&staleMs>0&&Date.now()-cycleAt<=staleMs?0:1)
  interval: 30s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  app:
    <<: *node-hardening
    image: "${APP_IMAGE_REF:?APP_IMAGE_REF must be a registry reference pinned by sha256 digest}"
    env_file:
      - .env.production
    environment:
      # The app is reachable only on the compose network; nginx is the public boundary.
      APP_BIND_HOST: "0.0.0.0"
      INTERNAL_APP_ORIGIN: "http://app:4173"
      COMMERCIAL_EVIDENCE_ROOT: "/app/release-evidence"
    command: ["node", "src/server.mjs"]
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./runtime:/app/runtime
      - ./docs/production/evidence:/app/release-evidence:ro
      - ./artifacts/release:/app/artifacts/release:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.APP_PORT || process.env.PORT || 4173) + '/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *node-hardening
    image: "${APP_IMAGE_REF:?APP_IMAGE_REF must be a registry reference pinned by sha256 digest}"
    env_file:
      - .env.production
    command: ["node", "src/chain-monitor.mjs"]
    environment:
      CHAIN_ID: "137"
      INTERNAL_APP_ORIGIN: "http://app:4173"
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./runtime:/app/runtime
      - ./docs/production/evidence:/app/release-evidence:ro
      - ./artifacts/release:/app/artifacts/release:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck: *worker-healthcheck

  worker-ethereum:
    profiles: ["multi-chain"]
    <<: *node-hardening
    image: "${APP_IMAGE_REF:?APP_IMAGE_REF must be a registry reference pinned by sha256 digest}"
    env_file:
      - .env.production
    command: ["node", "src/chain-monitor.mjs"]
    environment:
      CHAIN_ID: "1"
      INTERNAL_APP_ORIGIN: "http://app:4173"
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./runtime:/app/runtime
      - ./docs/production/evidence:/app/release-evidence:ro
      - ./artifacts/release:/app/artifacts/release:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck: *worker-healthcheck

  worker-avalanche:
    profiles: ["multi-chain"]
    <<: *node-hardening
    image: "${APP_IMAGE_REF:?APP_IMAGE_REF must be a registry reference pinned by sha256 digest}"
    env_file:
      - .env.production
    command: ["node", "src/chain-monitor.mjs"]
    environment:
      CHAIN_ID: "43114"
      INTERNAL_APP_ORIGIN: "http://app:4173"
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./runtime:/app/runtime
      - ./docs/production/evidence:/app/release-evidence:ro
      - ./artifacts/release:/app/artifacts/release:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck: *worker-healthcheck

  nginx:
    image: "${NGINX_IMAGE_REF:?NGINX_IMAGE_REF must be a registry reference pinned by sha256 digest}"
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /var/cache/nginx:rw,nosuid,nodev,size=32m
      - /var/run:rw,nosuid,nodev,size=4m
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      app:
        condition: service_healthy
      worker:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/jpyc-payment-terminal.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
