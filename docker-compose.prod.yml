services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jpyc-terminal-production:local
    env_file:
      - .env.production
    environment:
      # The app is reachable only on the compose network; nginx is the public boundary.
      APP_BIND_HOST: "0.0.0.0"
      INTERNAL_APP_ORIGIN: "http://app:4173"
      COMMERCIAL_EVIDENCE_ROOT: "/app/release-evidence"
    command: ["node", "src/server.mjs"]
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./runtime:/app/runtime
      - ./docs/production/evidence:/app/release-evidence:ro
      - ./artifacts/release:/app/artifacts/release:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.APP_PORT || process.env.PORT || 4173) + '/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: jpyc-terminal-production:local
    env_file:
      - .env.production
    command: ["node", "src/chain-monitor.mjs"]
    environment:
      CHAIN_ID: "137"
      INTERNAL_APP_ORIGIN: "http://app:4173"
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./runtime:/app/runtime
      - ./docs/production/evidence:/app/release-evidence:ro
      - ./artifacts/release:/app/artifacts/release:ro
    depends_on:
      app:
        condition: service_started

  worker-ethereum:
    profiles: ["multi-chain"]
    image: jpyc-terminal-production:local
    env_file:
      - .env.production
    command: ["node", "src/chain-monitor.mjs"]
    environment:
      CHAIN_ID: "1"
      INTERNAL_APP_ORIGIN: "http://app:4173"
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./runtime:/app/runtime
      - ./docs/production/evidence:/app/release-evidence:ro
      - ./artifacts/release:/app/artifacts/release:ro
    depends_on:
      app:
        condition: service_started

  worker-avalanche:
    profiles: ["multi-chain"]
    image: jpyc-terminal-production:local
    env_file:
      - .env.production
    command: ["node", "src/chain-monitor.mjs"]
    environment:
      CHAIN_ID: "43114"
      INTERNAL_APP_ORIGIN: "http://app:4173"
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./runtime:/app/runtime
      - ./docs/production/evidence:/app/release-evidence:ro
      - ./artifacts/release:/app/artifacts/release:ro
    depends_on:
      app:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/jpyc-payment-terminal.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
