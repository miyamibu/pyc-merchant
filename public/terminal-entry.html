<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>JPYCお支払い案内</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body class="entry-surface">
  <div class="wrap wrap-narrow">
    <header class="section-header">
      <div class="stack">
        <h1 class="title">会計確認</h1>
        <p class="small">店舗と金額をご確認ください。</p>
      </div>
      <span class="badge">お客様向け</span>
    </header>

    <p id="liveStatus" class="visually-hidden live-region" role="status" aria-live="polite" aria-atomic="true"></p>

    <section class="card stack mt-16" aria-labelledby="entryStateTitle">
      <div class="section-header">
        <h2 id="entryStateTitle" class="title title-lg">この会計</h2>
        <span id="entryBadge" class="status-pill s-blue" role="status" aria-live="polite" aria-atomic="true">確認中</span>
      </div>
      <div class="info-list">
        <div class="info-item">
          <span class="info-label">店舗</span>
          <p id="storeText" class="info-value customer-store-name">-</p>
        </div>
        <div class="info-item">
          <span class="info-label">状態</span>
          <p id="headlineText" class="info-value">会計を確認しています。</p>
          <p id="bodyText" class="helper-text">会計の準備後に、内容を確認して進みます。</p>
        </div>
      </div>
      <div id="entryReadyPanel" class="panel panel-warm stack entry-confirm-panel hidden" aria-labelledby="entryReadyTitle">
        <h3 id="entryReadyTitle" class="title title-md">この会計でよろしいですか</h3>
        <div class="info-list">
          <div class="info-item">
            <span class="info-label">金額</span>
            <p id="entryAmountText" class="amount-primary entry-amount">-</p>
          </div>
          <div class="info-item">
            <span class="info-label">会計番号</span>
            <p id="entryInvoiceText" class="info-value mono entry-reference">-</p>
          </div>
        </div>
        <button id="openInvoiceBtn" class="btn btn-primary btn-full" type="button">この会計を確認して進む</button>
        <p class="helper-text entry-confirm-note">1回の操作で最新内容を照合し、支払い画面を開きます。内容が変わった場合は移動を止め、再確認をお願いします。</p>
      </div>
      <button id="refreshEntryBtn" class="btn btn-secondary btn-full" type="button">会計状態を更新</button>
    </section>

    <section class="card stack mt-16" aria-labelledby="entryHelpTitle">
      <h2 id="entryHelpTitle" class="title title-md">ご案内</h2>
      <ul id="helpList" class="warning-list compact-list">
        <li>会計が表示されたら、店舗・金額・会計番号を確認してください。</li>
        <li>開いた支払い画面は、確認した会計に固定されます。</li>
        <li>長く進まない場合は、店舗スタッフへお声がけください。</li>
      </ul>
    </section>
  </div>

  <script src="/terminal-entry.js" defer></script>
</body>
</html>
